name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          # tests run with EMBEDDING_BACKEND=hash — skip torch/sbert entirely
          pip install fastapi "uvicorn[standard]" pydantic pydantic-settings \
              chromadb openai pypdf python-multipart numpy \
              pytest httpx ruff

      - name: Lint
        run: ruff check rag tests scripts

      - name: Test
        env:
          EMBEDDING_BACKEND: hash
          GROQ_API_KEY: ""
        run: pytest -q
